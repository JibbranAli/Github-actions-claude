name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the pipeline only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        # Fail on the first error, on unset variables, and on errors inside pipes.
        shell: bash -euo pipefail {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --strict

      - name: Build Docker image (not pushed)
        run: docker build --tag lw-releaseguard:${{ github.sha }} .
